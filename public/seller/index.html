<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seller Portal — Dot Marketplace</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/css/panel.css">
</head>
<body class="panel-app seller-app">
  <header class="panel-hdr">
    <a class="panel-brand" href="/">
      <svg width="24" height="24" viewBox="0 0 44 44" fill="none">
        <defs><linearGradient id="pbm-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd64d"/><stop offset=".55" stop-color="#ffc800"/><stop offset="1" stop-color="#f0b000"/></linearGradient></defs>
        <rect width="44" height="44" rx="13" fill="url(#pbm-g)"/>
        <circle cx="20" cy="25" r="8.2" fill="#17130a"/>
        <circle cx="20" cy="25" r="12.6" stroke="#17130a" stroke-width="2" opacity=".4"/>
        <circle cx="27.2" cy="14.7" r="3" fill="#17130a"/>
      </svg>
      <span class="panel-brand-name">Dot Marketplace</span> <span class="tag">Seller</span>
    </a>
    <div class="panel-hdr-actions">
      <div class="panel-user" id="panelUser"></div>
      <button class="btn btn-ghost btn-sm" id="btnSignOut" hidden>Sign out</button>
    </div>
  </header>

  <section class="panel-login" id="loginGate">
    <h1>Seller portal</h1>
    <p>Manage listings, track orders, balance and withdrawals.</p>
    <form id="loginForm">
      <label class="sf"><span>Email</span>
        <input id="loginEmail" type="email" autocomplete="username" placeholder="anna.pixel@sellers.dot.market" required>
      </label>
      <label class="sf"><span>Password</span>
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </label>
      <p class="muted" id="loginErr" style="color:var(--danger);font-size:13px;min-height:18px"></p>
      <button class="btn btn-pri" type="submit" id="loginSubmit">Sign in</button>
    </form>
    <p class="panel-foot">Demo: <code>anna.pixel@sellers.dot.market</code> / <code>test12345</code><br>
      <a href="/">← Back to marketplace</a></p>
  </section>

  <main class="panel-main" id="panelMain" hidden>
    <div class="mk-head">
      <h1>Seller panel</h1>
      <span class="count" id="sellerStatus">Manage listings, balance & withdrawals</span>
    </div>
    <nav class="chips" id="panelTabs" aria-label="Seller sections"></nav>
    <div id="panelRoot" class="seller-root"></div>
  </main>

  <div class="toasts" id="toasts"></div>

  <script src="/js/panel-common.js"></script>
  <script src="/seller-panel.js"></script>
</body>
</html>
